<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="css/google.css">
  <link rel="icon" type="image/png" href="images/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.png">
</head>
<body>

<!-- header -->
<header>
  <div class="header-left">
    <a class="header-link" href="#">Über Google</a>
    <a class="header-link" href="#">Store</a>
  </div>
  <div class="header-right">
    <a class="header-link" href="#">Gmail</a> <!--The # is a placeholder for a URL. It means the link goes nowhere-->
    <a class="header-link" href="#">Bilder</a>
    <a class="sign-in" href="#">Anmelden</a>
  </div>
</header>

<!-- main -->
<main>

  <!-- logo -->
  <div class="logo">
    <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span> <!--Inline (span) elements only take up as much width as their content needs. Block (p) elements always take up the full width of their container.-->
  </div>

  <!-- search bar -->
  <div class="search-box">
    <div class="search-inside">
      <p class="search-plus">+</p>
      <input type="text">
      <div class="search-icons">
        <button class="icon-button"><img src="images/mic.png" alt="mic" height="22"></button>
        <button class="icon-button"><img src="images/cam.png" alt="cam" height="22"></button>
        <button class="icon-button"><img src="images/ki-modus.png" alt="KI-Modus" height="30"></button>
      </div>
    </div>
  </div>

  <!-- buttons -->
  <div class="search-buttons">
    <button>Google Suche</button>
    <button>Auf gut Glück!</button>
  </div>

  <!-- languages -->
  <div class="lang-bar">
    Google gibt es auch auf:
    <a href="#">English</a>
    <a href="#">Francais</a>
    <a href="#">Italiano</a>
    <a href="#">Rumantsch</a>
  </div>

</main>

<!-- footer -->
<footer>
  <div class="footer-region">Schweiz</div>
  <div class="footer-climate">
    <img src="images/leaf.png" alt="leaf">
    Unser drittes Jahrzehnt für den Klimaschutz
  </div>
  <div class="footer-bottom">
    <div class="footer-links">
      <a href="#">Werbeprogramme</a>
      <a href="#">Unternehmen</a>
      <a href="#">Wie funktioniert die Google Suche?</a>
    </div>
    <div class="footer-links">
      <a href="#">Datenschutzerklärung</a>
      <a href="#">Nutzungsbedingungen</a>
      <a href="#">Einstellungen</a>
    </div>
  </div>
</footer>

</body>
</html>
